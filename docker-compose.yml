services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: riff
      POSTGRES_PASSWORD: riff
      POSTGRES_DB: riff
    ports:
      - "5435:5432"
    volumes:
      - riff_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riff -d riff"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://riff:riff@postgres:5432/riff?schema=public
      JWT_SECRET: dev-docker-secret
      PORT: "4000"
      PUBLIC_URL: http://localhost:4000
      DEMO_LIVE: "0"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  riff_pg:
