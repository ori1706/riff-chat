<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Riff iframe test</title>
    <style>
      body {
        margin: 0;
        background: #0b1020;
        padding: 24px;
        font-family: system-ui, sans-serif;
        color: #fff;
      }
      iframe {
        width: 1024px;
        height: 720px;
        border: 1px solid #2a2f4a;
        border-radius: 14px;
        display: block;
        max-width: 100%;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: flex-start;
      }
    </style>
  </head>
  <body>
    <h2 style="margin: 0 0 16px">Iframe embed check — Riff (default 1024×720)</h2>
    <div class="row">
      <div>
        <p style="margin: 0 0 8px; font-size: 12px; color: #9ca3af">1024×720</p>
        <!-- Update port if Vite prints a different URL (e.g. 5177). -->
    <iframe src="http://localhost:5173" title="Riff" allow="autoplay; clipboard-write"></iframe>
      </div>
    </div>
    <h3 style="margin-top: 32px">Width 800px</h3>
    <iframe
      src="http://localhost:5173"
      title="Riff 800"
      style="width: 800px; height: 720px"
      allow="autoplay; clipboard-write"
    ></iframe>
    <h3 style="margin-top: 32px">Width 1200px</h3>
    <iframe
      src="http://localhost:5173"
      title="Riff 1200"
      style="width: 1200px; height: 720px"
      allow="autoplay; clipboard-write"
    ></iframe>
  </body>
</html>
